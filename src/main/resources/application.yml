server:
  port: ${PORT:8080}

spring:
  application:
    name: grand-city-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grand_city}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

app:
  cors:
    # comma-separated list of allowed origins, e.g. https://grandcity.kg,http://localhost:3000
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-string-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  telegram:
    # Bot token from @BotFather and the chat (group) id that receives CRM alerts.
    # Leave empty to turn notifications off.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  crm:
    # Links in Telegram messages point here, e.g. https://grandcity.kg/admin/crm
    admin-url: ${CRM_ADMIN_URL:http://localhost:3000/admin/crm}
    # Dates in Telegram messages are shown in this zone.
    timezone: ${CRM_TIMEZONE:Asia/Bishkek}
    # Send a task reminder this many minutes before it is due.
    remind-before-minutes: ${CRM_REMIND_BEFORE_MINUTES:15}
  admin:
    # used only to (re)seed the default admin on first startup, see V2__seed_data.sql
    default-username: ${ADMIN_USERNAME:admin}

logging:
  level:
    root: INFO
    com.grandcity.backend: DEBUG
